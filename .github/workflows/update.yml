name: 更新市场宽度

on:
  schedule:
    - cron: "30 22 * * 1-5"   # UTC 22:30 = 美东收盘后 1.5–2.5 小时（周一至周五）
  workflow_dispatch:           # 可在 Actions 页面手动运行
  push:
    branches: [main]
    paths: ["breadth.py", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: breadth
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 计算宽度并生成页面
        run: python breadth.py --out site/index.html --csv data/breadth_daily.csv

      - name: 提交每日指标 CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/breadth_daily.csv
          git diff --cached --quiet || git commit -m "数据更新 $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
